services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devflow:devflow@postgres:5432/devflow
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: devflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devflow
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
